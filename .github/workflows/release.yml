name: Release

# Builds, signs, notarizes and publishes a downloadable .dmg.
#
# MANUAL ONLY (workflow_dispatch). It used to run on every `v*` tag push, but
# releases are cut locally with `make release-local`, which signs the dmg for
# Sparkle and writes appcast.xml. A tag-triggered run would rebuild the dmg and
# overwrite it (--clobber), so the published appcast's signature and length would
# no longer match and every user's update would be rejected. This workflow does not
# produce an appcast and refuses to touch a release that already has one.
#
# Required secrets are documented in docs/RELEASING.md. If they are missing the job
# fails early with a named error rather than half-way through a 20-minute build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
  TEAM_ID: 66CMG54L8U
  PROJECT: Punctual.xcodeproj
  SCHEME: Punctual

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      # A release published by `make release-local` carries appcast.xml, whose
      # EdDSA signature covers that exact dmg. Rebuilding and uploading over it
      # would break every installed copy's update. Refuse before building.
      - name: Refuse to overwrite a Sparkle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Fails CLOSED: only "release not found" counts as "no appcast".
          # Any other gh error (outage, rate limit, token scope) stops the job.
          if out="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1)"; then
            if printf '%s\n' "$out" | grep -qx 'appcast.xml'; then
              echo "::error::$TAG already has appcast.xml (published by make release-local). Not overwriting its dmg."
              exit 1
            fi
          elif ! printf '%s' "$out" | grep -qi 'release not found'; then
            echo "::error::could not inspect release $TAG: $out"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check required secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD AC_APPLE_ID AC_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set. See docs/RELEASING.md."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # Google Calendar credentials are git-ignored, so a release only carries
      # them if CI writes them in. Deliberately OPTIONAL: without the secrets
      # the build still succeeds and ships with Google available only to users
      # who supply their own OAuth client in Preferences. That keeps the
      # pipeline runnable before Google's verification review clears, rather
      # than blocking every release on it.
      - name: Write Google OAuth credentials (optional)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::No GOOGLE_CLIENT_ID secret. Google Calendar will require users to supply their own OAuth client. See docs/RELEASING.md."
            exit 0
          fi
          # Written, never echoed: `set -x` here would put the client secret in
          # a public build log.
          umask 077
          {
            printf 'GOOGLE_CLIENT_ID = %s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET = %s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'GOOGLE_AUTH_KEYCHAIN_NAME = Punctual.GoogleAuth\n'
          } > XCConfig/GoogleSecrets.xcconfig
          echo "Google Calendar credentials written for this build."

      - name: Select Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Expected Xcode not found at $DEVELOPER_DIR"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain with a random password. Nothing needs to unlock it
          # after this job, so there is no reason to carry a KEYCHAIN_PASSWORD secret.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT"

          # Without this, codesign blocks on a GUI "allow access" prompt that no one
          # is there to click, and the job hangs until it times out.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            echo "::error::A 'Mac Developer' or 'Apple Development' certificate cannot sign for direct download."
            exit 1
          fi

      - name: Install provisioning profile (optional)
        id: profile
        env:
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          # The app's real entitlements ask for
          # com.apple.developer.usernotifications.time-sensitive, which Apple gates
          # behind a provisioning profile. With a profile we sign the full
          # entitlements; without one we fall back to XCConfig/DeveloperID.entitlements
          # and LOSE the ability to break through Focus modes.
          if [ -z "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "::warning::No MACOS_PROVISIONING_PROFILE secret. Building WITHOUT time-sensitive notifications — meeting alerts will not break through Focus. See docs/RELEASING.md."
            echo "entitlements=XCConfig/DeveloperID.entitlements" >> "$GITHUB_OUTPUT"
            echo "specifier=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE="$PROFILE_DIR/meetingbarng.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw - 2>/dev/null || true)"
          if [ -z "$NAME" ]; then
            echo "::error::Could not read a Name out of MACOS_PROVISIONING_PROFILE — is it a base64-encoded .provisionprofile?"
            exit 1
          fi

          echo "Installed provisioning profile: $NAME"
          echo "entitlements=Punctual/Punctual.entitlements" >> "$GITHUB_OUTPUT"
          echo "specifier=$NAME" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          mkdir -p build
          # Manual signing, explicitly. Automatic would try to reach the developer
          # portal from a runner that has no account session and can silently pick a
          # different identity.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Punctual.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PUNCTUAL_ENTITLEMENTS="${{ steps.profile.outputs.entitlements }}" \
            PUNCTUAL_PROFILE_SPECIFIER="${{ steps.profile.outputs.specifier }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export app
        env:
          SPECIFIER: ${{ steps.profile.outputs.specifier }}
        run: |
          # Manual-signing export must name the profile per bundle id when one
          # is in use, or it fails with "requires a provisioning profile with
          # the Time Sensitive Notifications feature".
          cp XCConfig/ExportOptions-DeveloperID.plist build/ExportOptions.plist
          if [ -n "$SPECIFIER" ]; then
            /usr/libexec/PlistBuddy \
              -c "Add :provisioningProfiles dict" \
              -c "Add :provisioningProfiles:com.chykalophia.Punctual string $SPECIFIER" \
              build/ExportOptions.plist
          fi

          xcodebuild -exportArchive \
            -archivePath build/Punctual.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          ls -la build/export

      - name: Verify signature and hardened runtime
        run: |
          APP="build/export/Punctual.app"
          [ -d "$APP" ] || { echo "::error::No app at $APP"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"

          # Notarization rejects anything without the hardened runtime, but only
          # after the upload — checking here turns a 5-minute round trip into an
          # immediate failure.
          if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q "flags=.*runtime"; then
            echo "::error::Hardened runtime is not enabled — notarization would reject this."
            exit 1
          fi

          echo "Entitlements actually signed in:"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      - name: Package dmg
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          DMG="build/Punctual-$VERSION.dmg"
          chmod +x Scripts/package-dmg.sh
          Scripts/package-dmg.sh build/export/Punctual.app "$VERSION" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Sign the dmg
        run: |
          # The disk image itself is signed too, so Gatekeeper can evaluate it before
          # the user has mounted anything.
          codesign --force --sign "Developer ID Application" \
            --timestamp "${{ steps.package.outputs.dmg }}"
          codesign --verify --verbose=2 "${{ steps.package.outputs.dmg }}"

      - name: Notarize and staple
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID || '66CMG54L8U' }}
        run: |
          chmod +x Scripts/notarize.sh
          Scripts/notarize.sh "${{ steps.package.outputs.dmg }}"

      - name: Checksum
        id: checksum
        run: |
          DMG="${{ steps.package.outputs.dmg }}"
          # Run from the dmg's directory so the checksum file records a bare
          # filename — `shasum -c` next to the download then just works, which it
          # would not if the file said "build/Punctual-x.y.z.dmg".
          cd "$(dirname "$DMG")"
          BASE="$(basename "$DMG")"
          shasum -a 256 "$BASE" > "$BASE.sha256"
          cat "$BASE.sha256"
          echo "sha=${DMG}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          DMG: ${{ steps.package.outputs.dmg }}
          SHA: ${{ steps.checksum.outputs.sha }}
        run: |
          # Re-check right before writing: a release may have gained appcast.xml
          # (make release-local) while this job was building. Fails closed.
          if out="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1)"; then
            if printf '%s\n' "$out" | grep -qx 'appcast.xml'; then
              echo "::error::$TAG now has appcast.xml. Not overwriting its dmg."
              exit 1
            fi
          elif printf '%s' "$out" | grep -qi 'release not found'; then
            # A new release is created as a DRAFT: without an appcast it must
            # never become "latest", or every installed copy's update check
            # (releases/latest/download/appcast.xml) would fail.
            echo "No release for $TAG yet; creating a draft."
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes
          else
            echo "::error::could not inspect release $TAG: $out"
            exit 1
          fi

          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$DMG" "$SHA" --clobber
          echo "Uploaded $(basename "$DMG") to $TAG"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/meetingbarng.provisionprofile" 2>/dev/null || true
